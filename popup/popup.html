<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YKS Mobile View</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-root">
    <!-- Background Effects -->
    <div class="bg-effects">
      <div class="bg-grid"></div>
      <div class="bg-noise"></div>
      <div class="bg-orb bg-orb-magenta"></div>
      <div class="bg-orb bg-orb-emerald"></div>
    </div>

    <!-- Main Content -->
    <div class="popup-content">

      <!-- Header -->
      <header class="header">
        <div class="header-left">
          <div class="logo">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="5" y="2" width="14" height="20" rx="2" ry="2"/>
              <line x1="12" y1="18" x2="12.01" y2="18"/>
            </svg>
          </div>
          <div class="header-text">
            <h1>YKS Mobile View</h1>
            <span class="header-tag">MOBILE EMULATOR</span>
          </div>
        </div>
        <div class="header-right">
          <button id="btn-power" class="icon-btn" title="Toggle emulation">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M18.36 6.64a9 9 0 1 1-12.73 0"/>
              <line x1="12" y1="2" x2="12" y2="12"/>
            </svg>
          </button>
        </div>
      </header>

      <!-- Controls Bar -->
      <div class="controls-bar">
        <div class="orientation-group">
          <button id="btn-portrait" class="orient-btn active" title="Portrait">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="5" y="2" width="14" height="20" rx="2"/>
            </svg>
            <span>Portrait</span>
          </button>
          <button id="btn-landscape" class="orient-btn" title="Landscape">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="2" y="5" width="20" height="14" rx="2"/>
            </svg>
            <span>Landscape</span>
          </button>
        </div>
        <button id="btn-screenshot" class="icon-btn" title="Screenshot">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
            <circle cx="12" cy="13" r="4"/>
          </svg>
        </button>
        <button id="btn-reset" class="icon-btn btn-danger" title="Reset viewport">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/>
            <path d="M3 3v5h5"/>
          </svg>
        </button>
      </div>

      <!-- Search -->
      <div class="search-box">
        <svg class="search-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="8"/>
          <path d="m21 21-4.35-4.35"/>
        </svg>
        <input type="text" id="device-search" placeholder="Search devices..." autocomplete="off" spellcheck="false">
      </div>

      <!-- Category Tabs -->
      <div class="category-tabs">
        <button class="cat-tab active" data-category="all">All</button>
        <button class="cat-tab" data-category="phones">Phones</button>
        <button class="cat-tab" data-category="tablets">Tablets</button>
      </div>

      <!-- Device List -->
      <div class="device-list" id="device-list"></div>

      <!-- Custom Viewport -->
      <div class="custom-viewport">
        <div class="custom-label">CUSTOM VIEWPORT</div>
        <div class="custom-row">
          <input type="number" id="custom-w" class="custom-input" placeholder="Width" min="100" max="3840">
          <span class="custom-x">x</span>
          <input type="number" id="custom-h" class="custom-input" placeholder="Height" min="100" max="2160">
          <button id="btn-custom-apply" class="custom-apply">Apply</button>
        </div>
      </div>

      <!-- Footer -->
      <footer class="footer">
        <div class="status" id="status-bar">Select a device</div>
        <div class="shortcuts">
          <span class="shortcut"><kbd>Ctrl</kbd><kbd>Shift</kbd><kbd>M</kbd> Toggle</span>
          <span class="shortcut"><kbd>Ctrl</kbd><kbd>Shift</kbd><kbd>S</kbd> Screenshot</span>
        </div>
      </footer>

    </div>
  </div>

  <script src="../shared/devices.js"></script>
  <script src="popup.js"></script>
</body>
</html>
